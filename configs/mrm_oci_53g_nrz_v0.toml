[meta]
name = "mrm_oci_53g_nrz_synthetic_v0"
purpose = "Portable noiseless single-channel ELS + TX MRM + receiver example"
status = "synthetic_validation_not_device_prediction"
random_seed = 20260722

[signal]
modulation = { value = "NRZ", source = "PUBLIC_SPEC", ref = "OIF 200G-OCI Optical PHY v1.0 example" }
symbol_rate = { value = 53.125e9, unit = "baud", source = "PUBLIC_SPEC", ref = "OIF 200G-OCI Optical PHY v1.0 example" }
pattern = { value = "PRBS15", source = "ASSUMPTION", ref = "Portable deterministic baseline" }
samples_per_ui = { value = 32, unit = "sample/UI", source = "ASSUMPTION", ref = "Numerical resolution" }
number_of_bits = { value = 32767, unit = "bit", source = "ASSUMPTION", ref = "One PRBS15 period" }

[els]
apc_setpoint = { value = 10.0e-3, unit = "W", source = "ASSUMPTION", ref = "Synthetic optical-power reference plane" }
wavelength = { value = 1310.28e-9, unit = "m", source = "PUBLIC_SPEC", ref = "O-band example wavelength" }
