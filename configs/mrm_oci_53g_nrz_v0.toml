jitter_enabled = false

[mrm]
port = { value = "through", source = "MODEL", ref = "First portable topology" }
loaded_q = { value = 7500.0, unit = "1", source = "ASSUMPTION", ref = "Synthetic midpoint" }
loaded_q_sweep = { value = [5000.0, 7500.0, 10000.0], unit = "1", source = "ASSUMPTION", ref = "Synthetic sensitivity sweep" }
detuning = { value = 0.0, unit = "m", source = "ASSUMPTION", ref = "Initial operating point" }
